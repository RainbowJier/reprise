<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="420" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="419" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00A087"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E64B35"/>
    </marker>
  </defs>

  <!-- ===== 第一行：正常链路（深蓝） ===== -->
  <g stroke-width="1.5">
    <rect x="60"  y="56" width="128" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="203" y="56" width="128" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="346" y="56" width="128" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="489" y="56" width="128" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="632" y="56" width="128" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="124" y="77">登录成功</text>
    <text x="267" y="77">签发双token</text>
    <text x="410" y="77">存localStorage</text>
    <text x="553" y="77">携带 Bearer 头</text>
    <text x="696" y="77">过滤器验签</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="124" y="95">POST /auth/login</text>
    <text x="267" y="95">30 分钟 / 7 天</text>
    <text x="410" y="95">localStorage</text>
    <text x="553" y="95">Authorization</text>
    <text x="696" y="95">HS256 验签</text>
  </g>
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="190" y1="82" x2="199" y2="82" marker-end="url(#arrowGray)"/>
    <line x1="333" y1="82" x2="342" y2="82" marker-end="url(#arrowGray)"/>
    <line x1="476" y1="82" x2="485" y2="82" marker-end="url(#arrowGray)"/>
    <line x1="619" y1="82" x2="628" y2="82" marker-end="url(#arrowGray)"/>
  </g>

  <!-- ===== 分支：通过（青绿，左）/ 失败（红，右） ===== -->
  <path d="M696,108 L696,132 L130,132 L130,172" fill="none" stroke="#00A087" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <text x="410" y="127" text-anchor="middle" font-size="11" fill="#6B7280">通过</text>
  <path d="M696,108 L696,148 L530,148 L530,172" fill="none" stroke="#E64B35" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="615" y="143" text-anchor="middle" font-size="11" fill="#6B7280">失败</text>

  <!-- 成功支路（青绿） -->
  <g stroke-width="1.5">
    <rect x="60"  y="176" width="140" height="52" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
    <rect x="230" y="176" width="150" height="52" rx="8" fill="#00A087" fill-opacity="0.12" stroke="#00A087"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="130" y="197">验签通过</text>
    <text x="305" y="197">返回业务数据</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="130" y="215">注入 ThreadLocal</text>
    <text x="305" y="215">AjaxResult·code 200</text>
  </g>
  <line x1="200" y1="202" x2="226" y2="202" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- 失败支路（红） -->
  <g stroke-width="1.5">
    <rect x="455" y="176" width="150" height="52" rx="8" fill="#E64B35" fill-opacity="0.10" stroke="#E64B35"/>
    <rect x="625" y="176" width="155" height="52" rx="8" fill="#E64B35" fill-opacity="0.10" stroke="#E64B35"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="530" y="197">验签失败</text>
    <text x="702" y="197">响应 code 401</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="530" y="215">缺失/过期/伪造</text>
    <text x="702" y="215">HTTP 200 承载</text>
  </g>
  <line x1="605" y1="202" x2="621" y2="202" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ===== 401 下降到续期回路 ===== -->
  <path d="M702,228 L702,250 L135,250 L135,268" fill="none" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- 续期回路（深蓝 + 终点红） -->
  <g stroke-width="1.5">
    <rect x="60"  y="272" width="150" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="230" y="272" width="160" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="410" y="272" width="130" height="52" rx="8" fill="#3C5488" fill-opacity="0.12" stroke="#3C5488"/>
    <rect x="560" y="272" width="160" height="52" rx="8" fill="#E64B35" fill-opacity="0.10" stroke="#E64B35"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="135" y="293">挂起原请求</text>
    <text x="310" y="293">旋转双发新token</text>
    <text x="475" y="293">重放原请求</text>
    <text x="640" y="293">清空·跳转登录</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="135" y="311">单飞 /auth/refresh</text>
    <text x="310" y="311">旧 token 自然过期</text>
    <text x="475" y="311">用户无感知</text>
    <text x="640" y="311">refresh 已失效</text>
  </g>
  <g stroke="#5A6472" stroke-width="1.5">
    <line x1="210" y1="298" x2="226" y2="298" marker-end="url(#arrowGray)"/>
    <line x1="390" y1="298" x2="406" y2="298" marker-end="url(#arrowGray)"/>
  </g>

  <!-- 重放反馈回路（青绿虚线） -->
  <path d="M475,272 C 445,205 480,140 549,116" fill="none" stroke="#00A087" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <text x="440" y="160" text-anchor="end" font-size="11" fill="#6B7280">新 token 重放请求</text>

  <!-- 刷新失败分支（红虚线） -->
  <path d="M310,324 L310,344 L640,344 L640,330" fill="none" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="475" y="340" text-anchor="middle" font-size="11" fill="#6B7280">刷新失败</text>

  <text x="410" y="396" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜双 token 生命周期与 401 无感续期</text>
</svg>
