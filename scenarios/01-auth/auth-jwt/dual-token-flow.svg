<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 468" width="820" height="468" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 3｜双 token 分工：access 访问，refresh 续期</title>
<desc id="figure-desc">access 每次访问受保护资源时使用；refresh 只在续期时发送。30分钟与7天是示例有效期。access到期并不会自动定时刷新，下一次请求遇到认证失败后才按需续期。</desc>
<rect width="820" height="468" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="467" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<rect x="32" y="32" width="370" height="230" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">A</tspan></text>
<text x="84" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">access token</tspan></text>
<rect x="418" y="32" width="370" height="230" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="442" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="442" dy="0">B</tspan></text>
<text x="470" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="470" dy="0">refresh token</tspan></text>
<rect x="61" y="93" width="312" height="63" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="217.0" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="217.0" dy="0">访问受保护业务</tspan></text>
<text x="217.0" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="217.0" dy="0">示例有效期：30 分钟</tspan></text>
<rect x="447" y="93" width="312" height="63" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="603.0" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="603.0" dy="0">换取新的令牌对</tspan></text>
<text x="603.0" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="603.0" dy="0">示例有效期：7 天</tspan></text>
<text x="217" y="193" text-anchor="middle" font-size="14" font-weight="400" fill="#252A33"><tspan x="217" dy="0">Authorization: Bearer A0</tspan></text>
<text x="217" y="223" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="217" dy="0">频繁使用 · type=access</tspan></text>
<text x="603" y="193" text-anchor="middle" font-size="14" font-weight="400" fill="#252A33"><tspan x="603" dy="0">POST /auth/refresh 携带 R0</tspan></text>
<text x="603" y="223" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="603" dy="0">仅续期时使用 · type=refresh</tspan></text>
<rect x="32" y="300" width="232" height="67" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="148.0" y="327" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="148.0" dy="0">A0 到期</tspan></text>
<text x="148.0" y="349" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="148.0" dy="0">没有请求就不触发</tspan></text>
<rect x="294" y="300" width="232" height="67" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="410.0" y="327" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="410.0" dy="0">业务请求返回 401</tspan></text>
<text x="410.0" y="349" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410.0" dy="0">判断是否允许续期</tspan></text>
<rect x="556" y="300" width="232" height="67" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="672.0" y="327" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="672.0" dy="0">R0 换出 A1 + R1</tspan></text>
<text x="672.0" y="349" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="672.0" dy="0">保存新对，再重试</tspan></text>
<line x1="271" y1="333" x2="287" y2="333" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="533" y1="333" x2="549" y2="333" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="410" y="412" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="410" dy="0">不能互换使用；刷新是重新签发，不是修改旧 JWT。</tspan></text>
<text x="410" y="446" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 3｜双 token 分工：access 访问，refresh 续期</tspan></text>
</svg>
