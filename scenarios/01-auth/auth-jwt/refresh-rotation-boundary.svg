<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 496" width="820" height="496" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 6｜签发新 refresh 与一次性轮换，是两种不同保证</title>
<desc id="figure-desc">仅签发新JWT时R0不会立即失效，可重复使用直至自身过期。严格一次性轮换需要服务端原子消费与会话记录，R0成功使用后作废。jti不同不自动撤销旧令牌；临时网络失败与凭据无效应区分。</desc>
<rect width="820" height="496" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="495" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<rect x="32" y="32" width="370" height="320" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">A</tspan></text>
<text x="84" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">仅签发新 JWT</tspan></text>
<rect x="418" y="32" width="370" height="320" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="442" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="442" dy="0">B</tspan></text>
<text x="470" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="470" dy="0">严格一次性轮换</tspan></text>
<rect x="60" y="99" width="314" height="60" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="217.0" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="217.0" dy="0">R0 校验通过</tspan></text>
<text x="217.0" y="148" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="217.0" dy="0">签发 A1 + R1</tspan></text>
<rect x="446" y="99" width="314" height="60" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="603.0" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="603.0" dy="0">R0 校验 + 原子消费</tspan></text>
<text x="603.0" y="148" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="603.0" dy="0">记录轮换，签发 A1 + R1</tspan></text>
<line x1="217" y1="166" x2="217" y2="193" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="603" y1="166" x2="603" y2="193" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="201" width="314" height="68" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="217.0" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="217.0" dy="0">R0 仍可能再次使用</tspan></text>
<text x="217.0" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="217.0" dy="0">直至 R0 自己的 exp 到期</tspan></text>
<rect x="446" y="201" width="314" height="68" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="603.0" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="603.0" dy="0">R0 已作废，重用须拒绝</tspan></text>
<text x="603.0" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="603.0" dy="0">依赖会话记录与并发控制</tspan></text>
<text x="217" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="217" dy="0">新 jti ≠ 旧令牌撤销</tspan></text>
<text x="603" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="603" dy="0">绝对会话期限需单独设计</tspan></text>
<rect x="32" y="378" width="756" height="62" rx="6" fill="#E64B35" fill-opacity="0.1" stroke="#E64B35" stroke-width="1.5"/>
<text x="410" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="410" dy="0">不要把网络超时直接等同于凭据已失效。</tspan></text>
<text x="410" y="424" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">需要区分可恢复故障、无效凭据与重新登录策略。</tspan></text>
<text x="410" y="474" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 6｜签发新 refresh 与一次性轮换，是两种不同保证</tspan></text>
</svg>
