<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 1｜Session 与 JWT：凭据如何连接到用户身份</title>
<desc id="figure-desc">两列对比：Session 凭据用于查询服务端会话，JWT 凭据经签名与声明校验提取身份。两者都不应反复发送密码，JWT 不自动提供即时撤销。</desc>
<rect width="820" height="480" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="479" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<rect x="32" y="32" width="370" height="348" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">A</tspan></text>
<text x="84" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">Session + Cookie</tspan></text>
<rect x="418" y="32" width="370" height="348" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="442" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="442" dy="0">B</tspan></text>
<text x="470" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="470" dy="0">Bearer JWT</tspan></text>
<rect x="64" y="91" width="306" height="60" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="217.0" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="217.0" dy="0">一次登录验证</tspan></text>
<text x="217.0" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="217.0" dy="0">用户名 + 密码</tspan></text>
<line x1="217" y1="157" x2="217" y2="175" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="450" y="91" width="306" height="60" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="603.0" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="603.0" dy="0">一次登录验证</tspan></text>
<text x="603.0" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="603.0" dy="0">用户名 + 密码</tspan></text>
<line x1="603" y1="157" x2="603" y2="175" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="64" y="183" width="306" height="60" rx="6" fill="#4DBBD5" fill-opacity="0.1" stroke="#4DBBD5" stroke-width="1.5"/>
<text x="217.0" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="217.0" dy="0">后续携带会话 Cookie</tspan></text>
<text x="217.0" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="217.0" dy="0">浏览器按 Cookie 规则附带</tspan></text>
<rect x="450" y="183" width="306" height="60" rx="6" fill="#4DBBD5" fill-opacity="0.1" stroke="#4DBBD5" stroke-width="1.5"/>
<text x="603.0" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="603.0" dy="0">后续携带 access token</tspan></text>
<text x="603.0" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="603.0" dy="0">客户端设置 Authorization</tspan></text>
<line x1="217" y1="250" x2="217" y2="270" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="603" y1="250" x2="603" y2="270" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="64" y="278" width="306" height="70" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="217.0" y="305" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="217.0" dy="0">查询会话 → 确认用户</tspan></text>
<text x="217.0" y="327" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="217.0" dy="0">集中存储会话状态</tspan></text>
<rect x="450" y="278" width="306" height="70" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="603.0" y="305" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="603.0" dy="0">验签与校验声明 → 确认用户</tspan></text>
<text x="603.0" y="327" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="603.0" dy="0">提取身份，不等于自动可撤销</tspan></text>
<text x="410" y="414" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="410" dy="0">共同点：后续请求使用凭据，不重复发送密码。</tspan></text>
<text x="410" y="458" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 1｜Session 与 JWT：凭据如何连接到用户身份</tspan></text>
</svg>
