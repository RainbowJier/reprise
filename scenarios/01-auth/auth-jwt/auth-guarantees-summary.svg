<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 556" width="820" height="556" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 10｜认证心智模型：每项能力，都有自己的边界</title>
<desc id="figure-desc">六个对照块总结：登录建立身份不代表请求永久可信，刷新重新签发不是修改旧JWT，无感只减少交互不保证无延迟，单飞合并在飞任务不是全局锁，jti不是撤销，客户端登出不是服务端吊销。</desc>
<rect width="820" height="556" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="555" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<rect x="32" y="32" width="370" height="137" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">A</tspan></text>
<text x="84" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">登录</tspan></text>
<text x="56" y="102" text-anchor="start" font-size="14" font-weight="600" fill="#252A33"><tspan x="56" dy="0">建立一次可信身份</tspan></text>
<line x1="56" y1="115" x2="378" y2="115" stroke="#D9DFE8" stroke-width="1.5" stroke-linecap="round"/>
<text x="56" y="144" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280"><tspan x="56" dy="0">不代表后续请求永久可信</tspan></text>
<rect x="418" y="32" width="370" height="137" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="442" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="442" dy="0">B</tspan></text>
<text x="470" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="470" dy="0">刷新</tspan></text>
<text x="442" y="102" text-anchor="start" font-size="14" font-weight="600" fill="#252A33"><tspan x="442" dy="0">重新签发新的 token 对</tspan></text>
<line x1="442" y1="115" x2="764" y2="115" stroke="#D9DFE8" stroke-width="1.5" stroke-linecap="round"/>
<text x="442" y="144" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280"><tspan x="442" dy="0">不是修改旧 JWT 的 exp</tspan></text>
<rect x="32" y="189" width="370" height="137" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="220" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">C</tspan></text>
<text x="84" y="220" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">无感</tspan></text>
<text x="56" y="259" text-anchor="start" font-size="14" font-weight="600" fill="#252A33"><tspan x="56" dy="0">尽量不要求用户重新登录</tspan></text>
<line x1="56" y1="272" x2="378" y2="272" stroke="#D9DFE8" stroke-width="1.5" stroke-linecap="round"/>
<text x="56" y="301" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280"><tspan x="56" dy="0">不等于没有延迟或失败</tspan></text>
<rect x="418" y="189" width="370" height="137" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="442" y="220" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="442" dy="0">D</tspan></text>
<text x="470" y="220" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="470" dy="0">单飞</tspan></text>
<text x="442" y="259" text-anchor="start" font-size="14" font-weight="600" fill="#252A33"><tspan x="442" dy="0">共享当前在飞刷新任务</tspan></text>
<line x1="442" y1="272" x2="764" y2="272" stroke="#D9DFE8" stroke-width="1.5" stroke-linecap="round"/>
<text x="442" y="301" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280"><tspan x="442" dy="0">不自动协调跨页和晚到请求</tspan></text>
<rect x="32" y="346" width="370" height="137" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="377" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">E</tspan></text>
<text x="84" y="377" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">jti</tspan></text>
<text x="56" y="416" text-anchor="start" font-size="14" font-weight="600" fill="#252A33"><tspan x="56" dy="0">标识这是一枚不同的令牌</tspan></text>
<line x1="56" y1="429" x2="378" y2="429" stroke="#D9DFE8" stroke-width="1.5" stroke-linecap="round"/>
<text x="56" y="458" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280"><tspan x="56" dy="0">不等于旧 refresh 已失效</tspan></text>
<rect x="418" y="346" width="370" height="137" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="442" y="377" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="442" dy="0">F</tspan></text>
<text x="470" y="377" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="470" dy="0">客户端登出</tspan></text>
<text x="442" y="416" text-anchor="start" font-size="14" font-weight="600" fill="#252A33"><tspan x="442" dy="0">清除本地凭据与界面状态</tspan></text>
<line x1="442" y1="429" x2="764" y2="429" stroke="#D9DFE8" stroke-width="1.5" stroke-linecap="round"/>
<text x="442" y="458" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280"><tspan x="442" dy="0">不等于服务端吊销旧令牌</tspan></text>
<text x="410" y="534" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 10｜认证心智模型：每项能力，都有自己的边界</tspan></text>
</svg>
