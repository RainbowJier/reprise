<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 476" width="820" height="476" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 7｜JWT 的三段结构、声明与验签顺序</title>
<desc id="figure-desc">JWT头部、载荷、签名三段。头部与载荷仅编码不加密；验签后校验exp与type，iss和aud等按明确契约校验。jti不等于撤销记录，iat不自动完成时间策略校验。</desc>
<rect width="820" height="476" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="475" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<text x="410" y="49" text-anchor="middle" font-size="18" font-weight="600" fill="#252A33"><tspan x="410" dy="0">header.payload.signature</tspan></text>
<rect x="32" y="78" width="220" height="64" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="142.0" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="142.0" dy="0">HEADER</tspan></text>
<text x="142.0" y="127" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="142.0" dy="0">算法与令牌格式</tspan></text>
<rect x="268" y="78" width="284" height="64" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="410.0" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="410.0" dy="0">PAYLOAD</tspan></text>
<text x="410.0" y="127" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410.0" dy="0">身份、用途与时间声明</tspan></text>
<rect x="568" y="78" width="220" height="64" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="678.0" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="678.0" dy="0">SIGNATURE</tspan></text>
<text x="678.0" y="127" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="678.0" dy="0">完整性与来源验证</tspan></text>
<text x="142" y="180" text-anchor="middle" font-size="15" font-weight="400" fill="#252A33"><tspan x="142" dy="0">alg · typ</tspan></text>
<text x="142" y="210" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="142" dy="0">只接受允许的算法</tspan></text>
<text x="410" y="175" text-anchor="middle" font-size="14" font-weight="400" fill="#252A33"><tspan x="410" dy="0">sub · type · exp · iat · jti</tspan></text>
<text x="410" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">iss / aud 按契约检查</tspan></text>
<text x="678" y="180" text-anchor="middle" font-size="15" font-weight="400" fill="#252A33"><tspan x="678" dy="0">HS256 或 RS256</tspan></text>
<text x="678" y="210" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="678" dy="0">使用受信密钥验证</tspan></text>
<rect x="32" y="240" width="756" height="49" rx="6" fill="#E64B35" fill-opacity="0.1" stroke="#E64B35" stroke-width="1.5"/>
<text x="410" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="410" dy="0">编码不等于加密；载荷不放密码或敏感资料。</tspan></text>
<rect x="32" y="324" width="156" height="56" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="110.0" y="357.0" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="110.0" dy="0">验证签名</tspan></text>
<line x1="194" y1="352" x2="224" y2="352" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="232" y="324" width="156" height="56" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="310.0" y="357.0" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="310.0" dy="0">校验 exp / type</tspan></text>
<line x1="394" y1="352" x2="424" y2="352" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="432" y="324" width="156" height="56" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="510.0" y="357.0" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="510.0" dy="0">按需校验会话</tspan></text>
<line x1="594" y1="352" x2="624" y2="352" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="632" y="324" width="156" height="56" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="710.0" y="357.0" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="710.0" dy="0">建立请求身份</tspan></text>
<text x="410" y="419" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">iat 记录签发时间；jti 区分令牌，均不自动提供撤销。</tspan></text>
<text x="410" y="454" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 7｜JWT 的三段结构、声明与验签顺序</tspan></text>
</svg>
