<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 468" width="820" height="468" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 8｜令牌存放取舍：脚本可读性与跨站请求风险</title>
<desc id="figure-desc">左侧localStorage加请求头，脚本能读令牌，浏览器不自动附带Authorization，需要防XSS。右侧HttpOnlyCookie，脚本不能直接读凭据但浏览器可自动携带，仍要防CSRF。两者均需HTTPS、限流和日志脱敏。</desc>
<rect width="820" height="468" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="467" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<rect x="32" y="32" width="370" height="276" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">A</tspan></text>
<text x="84" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">localStorage + 请求头</tspan></text>
<rect x="418" y="32" width="370" height="276" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="442" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="442" dy="0">B</tspan></text>
<text x="470" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="470" dy="0">HttpOnly Cookie</tspan></text>
<rect x="60" y="96" width="314" height="64" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="217.0" y="123" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="217.0" dy="0">脚本可读令牌</tspan></text>
<text x="217.0" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="217.0" dy="0">主动设置 Authorization</tspan></text>
<rect x="446" y="96" width="314" height="64" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="603.0" y="123" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="603.0" dy="0">脚本不能直接读取 Cookie</tspan></text>
<text x="603.0" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="603.0" dy="0">浏览器按规则自动携带</tspan></text>
<text x="217" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="217" dy="0">重点：防范 XSS 盗取凭据</tspan></text>
<text x="217" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="217" dy="0">不自动跨站带头</tspan></text>
<text x="217" y="253" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="217" dy="0">不代表免疫所有攻击</tspan></text>
<text x="603" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="603" dy="0">重点：仍需 CSRF 防护</tspan></text>
<text x="603" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="603" dy="0">Secure · SameSite · 来源约束</tspan></text>
<text x="603" y="253" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="603" dy="0">HttpOnly 也不能消除 XSS 影响</tspan></text>
<rect x="32" y="338" width="756" height="74" rx="6" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="410" y="367" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="410" dy="0">共同底线</tspan></text>
<text x="410" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#252A33"><tspan x="410" dy="0">HTTPS · 密钥管理 · 登录/刷新限流 · 日志脱敏 · 敏感操作再次认证</tspan></text>
<text x="410" y="446" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 8｜令牌存放取舍：脚本可读性与跨站请求风险</tspan></text>
</svg>
