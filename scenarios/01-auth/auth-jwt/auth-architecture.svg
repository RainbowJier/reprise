<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" width="820" height="530"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="530" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="529" fill="none" stroke="#D9DFE8"/>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E64B35"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8491B4"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00A087"/>
    </marker>
  </defs>

  <!-- ===== 五个层带 ===== -->
  <g fill="#F4F7FA" stroke="#D9DFE8">
    <rect x="150" y="40"  width="560" height="72" rx="10"/>
    <rect x="150" y="128" width="560" height="72" rx="10"/>
    <rect x="150" y="216" width="560" height="72" rx="10"/>
    <rect x="150" y="304" width="560" height="72" rx="10"/>
    <rect x="150" y="392" width="560" height="72" rx="10"/>
  </g>

  <!-- 层名：小方块 + 深蓝粗体 + 模块名 -->
  <g font-size="14" font-weight="600" fill="#3C5488">
    <rect x="166" y="56" width="10" height="10" fill="#4DBBD5"/>
    <text x="184" y="66">前端</text>
    <rect x="166" y="144" width="10" height="10" fill="#3C5488"/>
    <text x="184" y="154">适配层</text>
    <rect x="166" y="232" width="10" height="10" fill="#3C5488"/>
    <text x="184" y="242">应用层</text>
    <rect x="166" y="320" width="10" height="10" fill="#3C5488"/>
    <text x="184" y="330">契约·领域层</text>
    <rect x="166" y="408" width="10" height="10" fill="#00A087"/>
    <text x="184" y="418">基础设施层</text>
  </g>
  <g font-size="11" fill="#6B7280">
    <text x="184" y="84">frontend · Vue3</text>
    <text x="184" y="172">demo-adapter</text>
    <text x="184" y="260">application</text>
    <text x="184" y="348">client · domain</text>
    <text x="184" y="436">infrastructure</text>
  </g>

  <!-- ===== 层内元件：白底 + 彩描边 ===== -->
  <!-- 前端（青） -->
  <g fill="#FFFFFF" stroke="#4DBBD5" stroke-width="1.5">
    <rect x="280" y="52"  width="120" height="48" rx="6"/>
    <rect x="410" y="52"  width="155" height="48" rx="6"/>
    <rect x="575" y="52"  width="135" height="48" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="340" y="73">登录/注册页</text>
    <text x="487" y="73">Pinia auth store</text>
    <text x="642" y="73">axios 拦截器</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="340" y="91">Login/Register</text>
    <text x="487" y="91">token 持久化</text>
    <text x="642" y="91">401 自动刷新</text>
  </g>

  <!-- 适配层（深蓝） -->
  <g fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5">
    <rect x="280" y="140" width="145" height="48" rx="6"/>
    <rect x="435" y="140" width="135" height="48" rx="6"/>
    <rect x="580" y="140" width="130" height="48" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="352" y="161">JwtAuthFilter</text>
    <text x="502" y="161">AuthController</text>
    <text x="645" y="161">UserController</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="352" y="179">白名单·验签·注入</text>
    <text x="502" y="179">/auth/**</text>
    <text x="645" y="179">GET /user/me</text>
  </g>

  <!-- 应用层（深蓝） -->
  <g fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5">
    <rect x="280" y="228" width="150" height="48" rx="6"/>
    <rect x="440" y="228" width="145" height="48" rx="6"/>
    <rect x="595" y="228" width="115" height="48" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="355" y="249">AuthServiceImpl</text>
    <text x="512" y="249">UserServiceImpl</text>
    <text x="652" y="249">BCrypt 配置</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="355" y="267">注册·登录·刷新</text>
    <text x="512" y="267">查询当前用户</text>
    <text x="652" y="267">密码哈希</text>
  </g>

  <!-- 契约·领域层（深蓝） -->
  <g fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5">
    <rect x="280" y="316" width="140" height="48" rx="6"/>
    <rect x="430" y="316" width="140" height="48" rx="6"/>
    <rect x="580" y="316" width="130" height="48" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="350" y="337">TokenProvider</text>
    <text x="500" y="337">服务接口 + DTO</text>
    <text x="645" y="337">User 实体</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="350" y="355">端口·依赖倒置</text>
    <text x="500" y="355">Auth·UserService</text>
    <text x="645" y="355">领域实体</text>
  </g>

  <!-- 基础设施层（青绿） -->
  <g fill="#FFFFFF" stroke="#00A087" stroke-width="1.5">
    <rect x="280" y="404" width="150" height="48" rx="6"/>
    <rect x="440" y="404" width="110" height="48" rx="6"/>
    <rect x="560" y="404" width="150" height="48" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="500" fill="#252A33">
    <text x="355" y="425">JwtTokenProvider</text>
    <text x="495" y="425">UserMapper</text>
    <text x="635" y="425">users 表·SQL</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#6B7280">
    <text x="355" y="443">jjwt · HS256</text>
    <text x="495" y="443">MapperScan</text>
    <text x="635" y="443">schema·data.sql</text>
  </g>

  <!-- ===== 左侧走廊：请求下行 / 401 上行 ===== -->
  <line x1="85" y1="90" x2="85" y2="156" stroke="#5A6472" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text transform="rotate(-90 62 123)" x="62" y="123" text-anchor="middle" font-size="11" fill="#6B7280">Bearer 请求</text>
  <line x1="125" y1="158" x2="125" y2="92" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text transform="rotate(-90 142 125)" x="142" y="125" text-anchor="middle" font-size="11" fill="#6B7280">code 401</text>

  <!-- 白名单直通（灰紫虚线，绕过过滤器直达 AuthController） -->
  <line x1="502" y1="112" x2="502" y2="136" stroke="#8491B4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowPurple)"/>
  <text x="494" y="129" text-anchor="end" font-size="11" fill="#6B7280">白名单直通：/auth/**、/health</text>

  <!-- 端口实现·依赖倒置（青绿虚线，TokenProvider → JwtTokenProvider） -->
  <line x1="352" y1="378" x2="352" y2="399" stroke="#00A087" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <text x="362" y="391" font-size="11" fill="#6B7280">端口实现·依赖倒置</text>

  <text x="410" y="504" text-anchor="middle" font-size="12" fill="#6B7280">图 2｜认证组件在 DDD 分层中的落位与请求链路</text>
</svg>
