<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 526" width="820" height="526" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 2｜页面、请求层与认证服务的职责边界</title>
<desc id="figure-desc">五层职责图：页面只处理交互，请求层协调访问和刷新，鉴权入口验证 access，认证服务验证 refresh，存储按需提供用户和会话状态。</desc>
<rect width="820" height="526" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="525" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<rect x="32" y="30" width="756" height="69" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="59" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">A</tspan></text>
<text x="88" y="59" text-anchor="start" font-size="15" font-weight="600" fill="#252A33"><tspan x="88" dy="0">页面</tspan></text>
<rect x="255" y="40" width="510" height="49" rx="6" fill="#4DBBD5" fill-opacity="0.1" stroke="#4DBBD5" stroke-width="1.5"/>
<text x="510" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="510" dy="0">输入凭据 · 展示结果</tspan></text>
<text x="510" y="78" text-anchor="middle" font-size="11" font-weight="400" fill="#6B7280"><tspan x="510" dy="0">不自行实现 token 刷新</tspan></text>
<rect x="32" y="115" width="756" height="69" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="144" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">B</tspan></text>
<text x="88" y="144" text-anchor="start" font-size="15" font-weight="600" fill="#252A33"><tspan x="88" dy="0">请求层</tspan></text>
<rect x="255" y="125" width="510" height="49" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="510" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="510" dy="0">注入 access · 协调重试</tspan></text>
<text x="510" y="163" text-anchor="middle" font-size="11" font-weight="400" fill="#6B7280"><tspan x="510" dy="0">刷新使用独立请求通道</tspan></text>
<rect x="32" y="200" width="756" height="69" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="229" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">C</tspan></text>
<text x="88" y="229" text-anchor="start" font-size="15" font-weight="600" fill="#252A33"><tspan x="88" dy="0">鉴权入口</tspan></text>
<rect x="255" y="210" width="510" height="49" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="510" y="231" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="510" dy="0">校验 access · 生成身份</tspan></text>
<text x="510" y="248" text-anchor="middle" font-size="11" font-weight="400" fill="#6B7280"><tspan x="510" dy="0">无效则拒绝受保护业务</tspan></text>
<rect x="32" y="285" width="756" height="69" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="314" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">D</tspan></text>
<text x="88" y="314" text-anchor="start" font-size="15" font-weight="600" fill="#252A33"><tspan x="88" dy="0">认证服务</tspan></text>
<rect x="255" y="295" width="510" height="49" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="510" y="316" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="510" dy="0">校验 refresh · 签发新对</tspan></text>
<text x="510" y="333" text-anchor="middle" font-size="11" font-weight="400" fill="#6B7280"><tspan x="510" dy="0">刷新不要求有效 access</tspan></text>
<rect x="32" y="370" width="756" height="69" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="399" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">E</tspan></text>
<text x="88" y="399" text-anchor="start" font-size="15" font-weight="600" fill="#252A33"><tspan x="88" dy="0">用户 / 会话</tspan></text>
<rect x="255" y="380" width="510" height="49" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="510" y="401" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="510" dy="0">密码哈希 · 用户状态</tspan></text>
<text x="510" y="418" text-anchor="middle" font-size="11" font-weight="400" fill="#6B7280"><tspan x="510" dy="0">会话撤销记录按需引入</tspan></text>
<text x="410" y="475" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="410" dy="0">刷新免 access 校验，不等于刷新无需凭据校验。</tspan></text>
<text x="410" y="504" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 2｜页面、请求层与认证服务的职责边界</tspan></text>
</svg>
