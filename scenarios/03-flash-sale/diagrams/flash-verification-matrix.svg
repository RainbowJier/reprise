<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 598" width="820" height="598" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 9｜秒杀验证：制造竞争、注入失败、核对持久结果</title>
<desc id="figure-desc">测试分三类：并发竞争验证库存和唯一订单，失败注入验证回滚和超时未知结果，时间标记重置验证边界。最后先收集客户端现象，再确认数据库终态与观测条件。本图是测试设计，不代表已运行或通过。</desc>
<rect width="820" height="598" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="597" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<rect x="32" y="32" width="756" height="126" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">A</tspan></text>
<text x="84" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">制造并发竞争</tspan></text>
<text x="58" y="102" text-anchor="start" font-size="14" font-weight="600" fill="#252A33"><tspan x="58" dy="0">多用户争库存 / 同用户重复请求</tspan></text>
<text x="432" y="97" text-anchor="start" font-size="13" font-weight="400" fill="#252A33"><tspan x="432" dy="0">核对已提交订单、库存下限</tspan></text>
<text x="432" y="123" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280"><tspan x="432" dy="0">与每用户唯一记录</tspan></text>
<rect x="32" y="178" width="756" height="126" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="209" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">B</tspan></text>
<text x="84" y="209" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">注入失败</tspan></text>
<text x="58" y="248" text-anchor="start" font-size="14" font-weight="600" fill="#252A33"><tspan x="58" dy="0">插单冲突 / 系统异常 / 请求超时</tspan></text>
<text x="432" y="243" text-anchor="start" font-size="13" font-weight="400" fill="#252A33"><tspan x="432" dy="0">扣减应回滚；超时后查终态</tspan></text>
<text x="432" y="269" text-anchor="start" font-size="12" font-weight="400" fill="#6B7280"><tspan x="432" dy="0">不能把日志或响应数当提交证明</tspan></text>
<rect x="32" y="324" width="756" height="126" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="355" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">C</tspan></text>
<text x="84" y="355" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">验证边界与生命周期</tspan></text>
<text x="58" y="394" text-anchor="start" font-size="14" font-weight="600" fill="#252A33"><tspan x="58" dy="0">时间边界 / 旧标记 / 重置并发</tspan></text>
<text x="432" y="389" text-anchor="start" font-size="12" font-weight="400" fill="#252A33"><tspan x="432" dy="0">区别未开始、售罄、重复与少卖</tspan></text>
<text x="432" y="415" text-anchor="start" font-size="12" font-weight="400" fill="#6B7280"><tspan x="432" dy="0">只在隔离环境构造破坏性时序</tspan></text>
<rect x="32" y="475" width="756" height="60" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="410" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="410" dy="0">观察请求 → 确认最新查询成功 → 核对数据库已提交状态</tspan></text>
<text x="410" y="523" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">测试设计示意，不代表已执行或已通过。</tspan></text>
<text x="410" y="576" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 9｜秒杀验证：制造竞争、注入失败、核对持久结果</tspan></text>
</svg>
