<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 2｜一次抢购：先校验，再扣库存、写订单并提交</title>
<desc id="figure-desc">身份认证通过后进入事务方法。依次读取商品检查时间、检查本地售罄与已有订单、条件扣库存、插订单，最终提交。错误逃出事务边界触发数据库回滚，内存标记不自动回滚。</desc>
<rect width="820" height="700" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="699" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<rect x="244" y="30" width="320" height="60" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="404.0" y="57" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="404.0" dy="0">身份认证通过</tspan></text>
<text x="404.0" y="79" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="404.0" dy="0">从受信上下文取得用户 ID</tspan></text>
<rect x="32" y="124" width="756" height="423" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<line x1="404" y1="97" x2="404" y2="151" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="55" y="157" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="55" dy="0">事务方法</tspan></text>
<text x="55" y="184" text-anchor="start" font-size="12" font-weight="400" fill="#6B7280"><tspan x="55" dy="0">数据库效果</tspan></text>
<text x="55" y="206" text-anchor="start" font-size="12" font-weight="400" fill="#6B7280"><tspan x="55" dy="0">同成同败</tspan></text>
<rect x="244" y="164" width="320" height="64" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="404.0" y="191" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="404.0" dy="0">读取商品 / 校验时间</tspan></text>
<text x="404.0" y="213" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="404.0" dy="0">不存在或活动不可用则拒绝</tspan></text>
<line x1="404" y1="235" x2="404" y2="244" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="572" y1="196" x2="592" y2="196" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="602" y="173" width="166" height="48" rx="6" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="685" y="202" text-anchor="middle" font-size="12" font-weight="400" fill="#252A33"><tspan x="685" dy="0">404 / 6101 / 6102</tspan></text>
<rect x="244" y="252" width="320" height="64" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="404.0" y="279" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="404.0" dy="0">检查标记 / 预查订单</tspan></text>
<text x="404.0" y="301" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="404.0" dy="0">商品查询在本地标记之前</tspan></text>
<line x1="404" y1="323" x2="404" y2="332" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="572" y1="284" x2="592" y2="284" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="602" y="261" width="166" height="48" rx="6" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="685" y="290" text-anchor="middle" font-size="12" font-weight="400" fill="#252A33"><tspan x="685" dy="0">6103 / 6104</tspan></text>
<rect x="244" y="340" width="320" height="64" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="404.0" y="367" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="404.0" dy="0">条件 UPDATE 扣一件</tspan></text>
<text x="404.0" y="389" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="404.0" dy="0">影响 1 行才继续；0 行不建单</tspan></text>
<line x1="404" y1="411" x2="404" y2="420" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="572" y1="372" x2="592" y2="372" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="602" y="349" width="166" height="48" rx="6" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="685" y="378" text-anchor="middle" font-size="12" font-weight="400" fill="#252A33"><tspan x="685" dy="0">0 行 → 6103</tspan></text>
<rect x="244" y="428" width="320" height="64" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="404.0" y="455" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="404.0" dy="0">INSERT 订单</tspan></text>
<text x="404.0" y="477" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="404.0" dy="0">保存商品快照与可信用户 ID</tspan></text>
<line x1="572" y1="460" x2="592" y2="460" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="602" y="437" width="166" height="48" rx="6" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="685" y="466" text-anchor="middle" font-size="12" font-weight="400" fill="#252A33"><tspan x="685" dy="0">唯一冲突 → 6104</tspan></text>
<text x="147" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#252A33"><tspan x="147" dy="0">内存标记</tspan></text>
<text x="147" y="386" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="147" dy="0">不自动回滚</tspan></text>
<text x="410" y="526" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">异常逃出边界：回滚本次库存与订单写入</tspan></text>
<line x1="404" y1="554" x2="404" y2="575" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="244" y="583" width="320" height="62" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="404.0" y="610" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="404.0" dy="0">事务提交成功 → 返回订单</tspan></text>
<text x="404.0" y="632" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="404.0" dy="0">扣减成功 ≠ 整笔交易已提交</tspan></text>
<text x="410" y="678" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 2｜一次抢购：先校验，再扣库存、写订单并提交</tspan></text>
</svg>
