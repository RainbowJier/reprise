<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430"
     font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="820" height="430" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="819" height="429" fill="none" stroke="#D9DFE8"/>

  <!-- 四个层带（漏斗由外向内） -->
  <g fill="#F4F7FA" stroke="#D9DFE8">
    <rect x="40" y="40"  width="560" height="76" rx="10"/>
    <rect x="40" y="130" width="560" height="76" rx="10"/>
    <rect x="40" y="220" width="560" height="76" rx="10"/>
    <rect x="40" y="310" width="560" height="76" rx="10"/>
  </g>

  <!-- 层名：小方块 + 深蓝粗体 -->
  <g font-size="14" font-weight="600" fill="#3C5488">
    <rect x="64" y="73"  width="10" height="10" fill="#4DBBD5"/>
    <text x="82" y="83">前端应用</text>
    <rect x="64" y="163" width="10" height="10" fill="#3C5488"/>
    <text x="82" y="173">鉴权过滤器</text>
    <rect x="64" y="253" width="10" height="10" fill="#F39B7F"/>
    <text x="82" y="263">内存闸门</text>
    <rect x="64" y="343" width="10" height="10" fill="#00A087"/>
    <text x="82" y="353">数据库</text>
  </g>

  <!-- 层内元件：白底 + 同层彩描边 -->
  <g fill="#FFFFFF" stroke-width="1.5">
    <g stroke="#4DBBD5">
      <rect x="160" y="54"  width="136" height="48" rx="6"/>
      <rect x="312" y="54"  width="136" height="48" rx="6"/>
      <rect x="464" y="54"  width="136" height="48" rx="6"/>
    </g>
    <g stroke="#3C5488">
      <rect x="160" y="144" width="205" height="48" rx="6"/>
      <rect x="395" y="144" width="205" height="48" rx="6"/>
    </g>
    <g stroke="#F39B7F">
      <rect x="160" y="234" width="440" height="48" rx="6"/>
    </g>
    <g stroke="#00A087">
      <rect x="160" y="324" width="136" height="48" rx="6"/>
      <rect x="312" y="324" width="136" height="48" rx="6"/>
      <rect x="464" y="324" width="136" height="48" rx="6"/>
    </g>
  </g>
  <g text-anchor="middle" fill="#252A33">
    <text x="228" y="83"  font-size="13" font-weight="500">按钮状态置灰</text>
    <text x="380" y="83"  font-size="13" font-weight="500">防连点防抖</text>
    <text x="532" y="83"  font-size="13" font-weight="500">库存 2s 轮询</text>
    <text x="262" y="173" font-size="13" font-weight="500">JWT 验签过滤器</text>
    <text x="497" y="173" font-size="13" font-weight="500">注入用户上下文</text>
    <text x="380" y="263" font-size="13" font-weight="500">售罄标记 ConcurrentHashMap（单机内存，O(1) 快速失败）</text>
    <text x="228" y="344" font-size="13" font-weight="500">原子条件更新</text>
    <text x="228" y="362" font-size="11" fill="#6B7280">WHERE stock &gt; 0</text>
    <text x="380" y="344" font-size="13" font-weight="500">唯一索引限购</text>
    <text x="380" y="362" font-size="11" fill="#6B7280">uk(item_id, user_id)</text>
    <text x="532" y="344" font-size="13" font-weight="500">同事务回滚</text>
    <text x="532" y="362" font-size="11" fill="#6B7280">扣减与下单同生共死</text>
  </g>

  <!-- 右侧：每层拦截说明（漏斗语义） -->
  <g stroke="#9AA4B2" stroke-width="1">
    <line x1="600" y1="78"  x2="614" y2="78"/>
    <line x1="600" y1="168" x2="614" y2="168"/>
    <line x1="600" y1="258" x2="614" y2="258"/>
    <line x1="600" y1="348" x2="614" y2="348"/>
  </g>
  <g font-size="11" fill="#6B7280">
    <text x="622" y="72">拦截：未开始/售罄的</text>
    <text x="622" y="88">无效点击（不发出请求）</text>
    <text x="622" y="162">拦截：未登录与伪造</text>
    <text x="622" y="178">token（code=401）</text>
    <text x="622" y="252">拦截：已售罄商品请求</text>
    <text x="622" y="268">O(1) 拒绝，不再触库</text>
    <text x="622" y="342">兜底：正确性最后防线</text>
    <text x="622" y="358">影响行数是唯一真相</text>
  </g>

  <text x="410" y="414" text-anchor="middle" font-size="12" fill="#6B7280">图 1｜秒杀请求漏斗：越靠外的层拦截成本越低，数据库只承接有机会成功的请求</text>
</svg>
