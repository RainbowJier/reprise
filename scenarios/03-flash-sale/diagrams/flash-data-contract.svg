<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 594" width="820" height="594" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">图 8｜商品、订单、身份与四类接口的职责关系</title>
<desc id="figure-desc">商品保存库存与活动时间，订单保存用户商品关联和成交快照，用户ID来自可信身份。每次固定一件，唯一约束不含活动批次。下方分别列出列表、抢购、我的订单和演示重置接口，支付取消与自动回补不在模型中。</desc>
<rect width="820" height="594" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="819" height="593" fill="none" stroke="#D9DFE8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5A6472"/></marker></defs>
<rect x="32" y="32" width="370" height="220" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="56" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="56" dy="0">A</tspan></text>
<text x="84" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="84" dy="0">商品 flash_items</tspan></text>
<rect x="418" y="32" width="370" height="220" rx="10" fill="#F4F7FA" fill-opacity="1" stroke="#D9DFE8" stroke-width="1"/>
<text x="442" y="63" text-anchor="start" font-size="18" font-weight="600" fill="#3C5488"><tspan x="442" dy="0">B</tspan></text>
<text x="470" y="63" text-anchor="start" font-size="16" font-weight="600" fill="#252A33"><tspan x="470" dy="0">订单 flash_orders</tspan></text>
<text x="56" y="108" text-anchor="start" font-size="14" font-weight="400" fill="#252A33"><tspan x="56" dy="0">id / name / price</tspan></text>
<text x="442" y="108" text-anchor="start" font-size="14" font-weight="400" fill="#252A33"><tspan x="442" dy="0">orderId / itemId / userId</tspan></text>
<text x="56" y="151" text-anchor="start" font-size="14" font-weight="400" fill="#252A33"><tspan x="56" dy="0">total_stock / stock</tspan></text>
<text x="442" y="151" text-anchor="start" font-size="14" font-weight="400" fill="#252A33"><tspan x="442" dy="0">itemName / price 快照</tspan></text>
<text x="56" y="194" text-anchor="start" font-size="14" font-weight="400" fill="#252A33"><tspan x="56" dy="0">start_time / end_time</tspan></text>
<text x="442" y="194" text-anchor="start" font-size="14" font-weight="400" fill="#252A33"><tspan x="442" dy="0">status / createTime</tspan></text>
<line x1="402" y1="157" x2="412" y2="157" stroke="#5A6472" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="32" y="278" width="756" height="67" rx="6" fill="#00A087" fill-opacity="0.1" stroke="#00A087" stroke-width="1.5"/>
<text x="410" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#252A33"><tspan x="410" dy="0">唯一约束 (item_id, user_id) · 用户 ID 来自认证上下文</tspan></text>
<text x="410" y="327" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">当前每次一件；多轮活动、支付、取消与自动回补需独立建模。</tspan></text>
<rect x="32" y="375" width="370" height="65" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="217.0" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="217.0" dy="0">GET /flash/items</tspan></text>
<text x="217.0" y="424" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="217.0" dy="0">库存 / 时间状态 / mine 快照</tspan></text>
<rect x="418" y="375" width="370" height="65" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="603.0" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="603.0" dy="0">POST …/{itemId}/seckill</tspan></text>
<text x="603.0" y="424" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="603.0" dy="0">扣减 + 建单 + 提交</tspan></text>
<rect x="32" y="458" width="370" height="65" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="217.0" y="485" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="217.0" dy="0">GET /flash/orders/mine</tspan></text>
<text x="217.0" y="507" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="217.0" dy="0">只查询当前用户的订单</tspan></text>
<rect x="418" y="458" width="370" height="65" rx="6" fill="#3C5488" fill-opacity="0.1" stroke="#3C5488" stroke-width="1.5"/>
<text x="603.0" y="485" text-anchor="middle" font-size="15" font-weight="600" fill="#252A33"><tspan x="603.0" dy="0">POST …/demo/reset/{itemId}</tspan></text>
<text x="603.0" y="507" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="603.0" dy="0">仅限隔离演示的破坏性操作</tspan></text>
<text x="410" y="572" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280"><tspan x="410" dy="0">图 8｜商品、订单、身份与四类接口的职责关系</tspan></text>
</svg>
